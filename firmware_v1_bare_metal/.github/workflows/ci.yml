name: CI

on:
  push:
  pull_request:

jobs:
  build-firmware:
    name: Build AVR firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build (ATmega2560)
        run: pio run

  host-tests:
    name: Host-side unit tests (12 suites)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run
        run: |
          cd test/host
          make run

  coverage:
    name: Code coverage (branch coverage, host tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install gcovr
        run: pip install gcovr
      - name: Measure coverage
        run: |
          cd test/host
          make coverage

  stack-analysis:
    name: Worst-case stack usage analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install AVR toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-avr avr-libc
      - name: Analyze
        run: |
          cd tools
          python3 stack_analysis.py

  static-analysis:
    name: Static analysis (cppcheck) + EEPROM lifetime sanity check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Run cppcheck
        run: |
          cppcheck --enable=warning,style,performance,portability \
                    --inconclusive --inline-suppr --std=c11 --error-exitcode=1 \
                    -Isrc src/*.c
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: EEPROM lifetime sanity check
        run: |
          cd tools
          python3 test_eeprom_lifetime.py

  telemetry-tests:
    name: Telemetry tooling tests (parser, logger)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: pip install -r tools/telemetry/requirements.txt
      - name: Run tests
        run: |
          cd tools/telemetry
          python3 test_parser.py
          python3 test_logger_integration.py