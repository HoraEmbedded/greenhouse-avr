; PlatformIO Project Configuration File
; Projet : Serre Industrielle V2 - ESP32 + FreeRTOS + MQTT/TLS
; Auteur : HoraEmbedded
; Date : 2026

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; --- bibliothèques ---
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0
    
; --- Options de build ---
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DFREE_RTOS

