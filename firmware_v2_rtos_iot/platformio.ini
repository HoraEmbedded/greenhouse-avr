[env:esp32dev_wokwi]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DPUBLISHER_SERIAL
    -Isrc/core
    -Isrc/tasks
    -Isrc/platform
    -Isrc/network
    -Iinclude
lib_deps =
    bblanchon/ArduinoJson@^7.0
    https://github.com/beegee-tokyo/DHTesp.git
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
build_src_filter =
    +<*>
    -<network/publisher_mqtt.cpp>
    -<network/wifi_manager.cpp>
    -<platform/dht22_bitbang.cpp>
test_ignore = test/host

[env:esp32dev_hw]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DPUBLISHER_MQTT
    -Isrc/core
    -Isrc/tasks
    -Isrc/platform
    -Isrc/network
    -Iinclude
lib_deps =
    bblanchon/ArduinoJson@^7.0
    knolleary/PubSubClient@^2.8
    marcoschwartz/LiquidCrystal_I2C@^1.1.4

build_src_filter =
    +<*>
    -<network/publisher_serial.cpp>
    -<platform/dht22_wokwi.cpp>
test_ignore = test/host